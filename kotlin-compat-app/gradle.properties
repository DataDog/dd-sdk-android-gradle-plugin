org.gradle.jvmargs=-Xmx4g
android.useAndroidX=true
# Apply the Kotlin Gradle plugin explicitly, so its version is the one passed with -PkotlinVersion
android.builtInKotlin=false
android.newDsl=false

# Defaults for opening and building this project locally (e.g. in Android Studio).
# CI always overrides both with -PkotlinVersion / -PddPluginVersion.
# Publish the plugin first from the repo root: ./gradlew publishToMavenLocal -Pdd-skip-signing
# ddPluginVersion must match MavenConfig.VERSION in tools/build-config of the plugin build.
kotlinVersion=2.4.20
ddPluginVersion=1.32.0-SNAPSHOT

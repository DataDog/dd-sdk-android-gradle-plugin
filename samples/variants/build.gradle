import com.datadog.gradle.config.AndroidConfig
import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

plugins {
    id 'com.android.application'
    // Applied before Kotlin on purpose: ktlint-gradle registers Android source-set tasks twice
    // when it is applied after the Kotlin plugin.
    id 'ktlint'
    id 'kotlin-android'

    // Analysis tools
    id('dev.detekt')

    id 'datadogBuildConfig'

    // id 'com.datadoghq.dd-sdk-android-gradle-plugin'
}

android {
    compileSdkVersion = AndroidConfig.TARGET_SDK
    buildToolsVersion = AndroidConfig.BUILD_TOOLS_VERSION

    defaultConfig {
        applicationId "com.datadog.example.variants"
        minSdkVersion AndroidConfig.MIN_SDK
        targetSdkVersion AndroidConfig.TARGET_SDK
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    namespace = "com.datadog.example.variants"

    sourceSets.named("main") {
        java.srcDir("src/main/kotlin")
    }

    flavorDimensions("version", "colour")
    productFlavors {
        demo {
            dimension "version"
            applicationIdSuffix ".demo"
            versionNameSuffix "-demo"
        }
        full {
            dimension "version"
            applicationIdSuffix ".full"
            versionNameSuffix "-full"
        }
        pro {
            dimension "version"
            applicationIdSuffix ".pro"
            versionNameSuffix "-pro"
        }

        red {
            dimension "colour"
        }
        green {
            dimension "colour"
        }
        blue {
            dimension "colour"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

datadogBuildConfig {
    applyKotlinConfig(KotlinVersion.KOTLIN_2_3, KotlinVersion.KOTLIN_2_3, null)
    // Colours don't have dedicated sources, analyzing one variant per version flavor is enough
    // (Detekt matches the combined flavor name of each variant)
    applyDetektConfig(["demoGreen", "demoBlue", "fullGreen", "fullBlue", "proGreen", "proBlue"])
}

dependencies {
    implementation(project(':samples:lib-module'))
    implementation(libs.kotlinRuntime23)

    implementation(libs.androidx.core)
    implementation(libs.androidx.appcompat)
    implementation(libs.androidx.constraintlayout)

    // implementation(libs.datadogSdkRum)
}

